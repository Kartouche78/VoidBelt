[package]
name = "admin2"
version = "0.1.0"
edition = "2024"
description = "Comptes Voidbelt : authentification Google, sessions, profils, et bientot la ranked."

# Crate autonome, comme `voidbelt-rl2` : `cargo test` y tourne seul.
[workspace]

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "rt", "macros"] }
tracing = "0.1.44"
# Base des comptes : le meme fichier SQLite que les creations de l'admin.
rusqlite = { version = "0.32", features = ["bundled"] }
# Connexion Google en OpenID Connect : code d'autorisation, PKCE, nonce, et
# signature du jeton d'identite verifiee contre les cles publiques de Google.
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
# Identifiants de session : aleatoire du systeme, et seule leur empreinte
# est gardee en base.
getrandom = "0.3"
sha2 = "0.10"
