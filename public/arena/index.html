<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOIDBELT // L'Arène</title>
<meta name="description" content="VOIDBELT — l'Arène : vaisseau à inertie, astéroïdes, atelier, boss toutes les cinq vagues.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0B'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23FF4D00' stroke-width='3'/%3E%3Crect y='14' width='32' height='4' fill='%23EDE7DA'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/css/base.css">
<link rel="stylesheet" href="/shared/css/game-ui.css">
<link rel="stylesheet" href="arena.css">
</head>
<body>

<canvas id="gamebg" aria-hidden="true"></canvas>

<aside class="rail rail-l" aria-hidden="true">
  <div class="sq fill"></div>
  <div class="vert">ARÈNE 04 / SECTEUR DE COMBAT</div>
  <div class="bar"></div>
  <div class="sq"></div>
</aside>

<aside class="rail rail-r" aria-hidden="true">
  <div class="sq"></div>
  <div class="bar"></div>
  <div class="vert">PROTOCOLE DE COLONISATION — V.0.9.4</div>
  <div class="sq fill"></div>
</aside>

<div class="stage">
  <div class="view arena on" id="p3">

    <div class="hud">
      <div class="hud-l">
        <div class="lvl"><i></i><b id="a-lvl">01</b><span class="xpbar"><i id="a-xp"></i></span></div>
        <div class="hullbar"><i id="a-hull"></i><em id="a-shield"></em></div>
      </div>
      <div class="hud-r">
        <span class="res" style="--c:#FF4D00"><i></i><b id="r0">0</b></span>
        <span class="res" style="--c:#5FEBF7"><i></i><b id="r1">0</b></span>
        <span class="res" style="--c:#EDE7DA"><i></i><b id="r2">0</b></span>
        <span class="res" style="--c:#FFC66B"><i></i><b id="r3">0</b></span>
      </div>
    </div>

    <div class="keys" aria-hidden="true">
      <span class="kbd wide">SOURIS</span>
      <span class="kbd wide">TIR AUTO</span>
      <span class="kbd wide">CLIC DROIT</span>
      <span class="kbd wide">ÉCHAP</span>
    </div>

    <!-- invite de capture du pointeur : la partie ne demarre qu'au clic -->
    <div class="lockcue" id="a-lock" hidden>
      <b>CLIQUEZ POUR PILOTER</b>
      <span>La souris dirige le vaisseau <s>//</s> le tir est <em>automatique</em></span>

      <div class="lockvol" id="a-vol">
        <label for="a-volr">Volume</label>
        <input type="range" id="a-volr" min="0" max="100" step="1" value="30"
               aria-label="Volume de la musique">
        <output id="a-volv" for="a-volr">30</output>
      </div>

      <span><span class="kbd">Clic droit</span> atelier <s>//</s> <span class="kbd">ÉCHAP</span> réglages</span>
    </div>

    <!-- choix de module a chaque niveau -->
    <div class="gmodal" id="a-cards" hidden>
      <div class="gpanel">
        <div class="ghead"><span>NIVEAU <b id="a-lvlnum">02</b></span><span>MODULE</span></div>
        <div class="cardrow" id="a-cardrow"></div>
      </div>
    </div>

    <!-- atelier : onglets a gauche, icones a droite, achat au clic -->
    <div class="gmodal" id="a-shop" hidden>
      <div class="gpanel gshop">
        <div class="ghead">
          <span>ATELIER</span>
          <span class="resmini" id="a-resmini"></span>
          <button class="gx" id="a-shopclose" aria-label="Fermer">&#10005;</button>
        </div>
        <div class="gbody">
          <nav class="gtabs" id="a-tabs"></nav>
          <div class="gmain">
            <div class="gitems" id="a-items"></div>
            <div class="gdetail" id="a-detail"><span class="gnone"></span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="gmodal" id="a-over" hidden>
      <div class="gpanel gover">
        <div class="ghead"><span>SIGNAL PERDU</span><span>NIV <b id="a-score">01</b></span></div>
        <button class="gbtn" id="a-restart">RELANCER</button>
      </div>
    </div>

  </div>
</div>

<div class="stripes"></div>
<footer class="footer">
  <div class="cell">
    <span>© 2026 VOIDBELT</span>
    <nav class="sitenav" aria-label="Navigation du site">
      <a href="/">ACCUEIL</a>
    </nav>
  </div>
  <div class="ticker"><div class="ticker-track" id="tick"></div></div>
  <div class="cell">
    <span class="rvol bare">
      <button class="rvol-b" id="f-mute" type="button" aria-pressed="false"
              aria-label="Couper la musique"><i></i><span>SON</span></button>
      <input class="rvol-r" type="range" id="f-volr" min="0" max="100" step="1" value="30"
             aria-label="Volume de la musique">
      <output class="rvol-o" id="f-volv" for="f-volr">30</output>
    </span>
  </div>
</footer>

<div class="scan"></div>

<!-- bande-son de l'arene -->
<audio id="ko" src="/shared/audio/KO.mp3" loop preload="none"></audio>

<script src="/shared/js/util.js"></script>
<script src="/shared/js/audio.js"></script>
<script src="arena.js"></script>
<script src="/shared/js/ticker.js"></script>
<script src="/shared/js/page-scroll.js" data-previous="/"></script>
</body>
</html>
