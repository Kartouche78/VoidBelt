<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUMP'N BUMP // VOIDBELT</title>
<meta name="description" content="Quatre lapins, une falaise, un bassin et un trampoline. Sautez sur la tete des autres.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0B'/%3E%3Crect x='9' y='4' width='4' height='9' fill='%23EDE7DA'/%3E%3Crect x='19' y='4' width='4' height='9' fill='%23EDE7DA'/%3E%3Crect x='7' y='12' width='18' height='15' rx='7' fill='%23EDE7DA'/%3E%3Crect x='12' y='17' width='3' height='4' fill='%230A0A0B'/%3E%3Crect x='18' y='17' width='3' height='4' fill='%230A0A0B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/css/base.css">
<link rel="stylesheet" href="/jumpnbump/jumpnbump.css">
</head>
<body class="jnb">

<div class="jnb-stage">
  <div class="jnb-frame">
    <canvas id="stage" aria-label="Jump'n Bump"></canvas>

    <!-- La barre de reglages se cale sur la bande noire du bas de la
         carte du lobby, et ne s'affiche qu'a gauche du tronc. -->
    <div class="lobbybar" id="lobbybar" hidden>
      <div class="lb-col">
        <span class="lb-t">VOTRE PRENOM</span>
        <input id="f-name" type="text" maxlength="14" placeholder="Lapin"
               autocomplete="off" spellcheck="false" aria-label="Votre prenom">
      </div>
      <div class="lb-col">
        <span class="lb-t">PELAGE</span>
        <div class="colors" id="colors"></div>
      </div>
      <div class="lb-col">
        <span class="lb-t">PARTIE</span>
        <div class="lb-row">
          <button class="btn primary" id="b-multi" type="button">MULTIJOUEUR</button>
          <button class="roomtag" id="roomtag" type="button" hidden
                  title="Cliquez pour copier le code"></button>
        </div>
      </div>
    </div>

    <p class="lobbytip" id="lobbytip" hidden></p>
  </div>

  <!-- ---------------- multijoueur ---------------- -->
  <section class="panel hidden" id="screen-multi">
    <div class="panel-in wide">
      <p class="eyebrow"><i></i><span>MULTIJOUEUR</span><u>//</u><span id="rooms-state">&mdash;</span><i></i></p>
      <h2 class="title small">SERVEURS OUVERTS</h2>

      <div class="rooms" id="rooms"><p class="empty">Recherche&hellip;</p></div>

      <div class="row wrap">
        <form class="row join" id="form-join">
          <span class="code-lbl">CODE</span>
          <span class="code-in" id="code-in">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 1">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 2">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 3">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 4">
          </span>
          <button class="btn" type="submit">REJOINDRE</button>
        </form>
        <button class="mini" id="b-refresh" type="button">RAFRAICHIR</button>
      </div>

      <div class="row wrap">
        <button class="btn primary" id="b-create" type="button">CREER UN SERVEUR</button>
        <label class="check"><input type="checkbox" id="f-priv"><span>PRIVE</span></label>
        <span class="hint">Un serveur prive n'apparait pas dans la liste : on y entre
          en tapant son code.</span>
      </div>

      <div class="row wrap">
        <button class="back as-btn" id="b-multi-close" type="button">&#8592; retour au lobby</button>
        <button class="back as-btn hidden" id="b-quitroom" type="button">quitter le serveur</button>
      </div>
    </div>
  </section>

  <!-- ---------------- reglages (Echap) ---------------- -->
  <section class="panel modal hidden" id="screen-options">
    <div class="panel-in">
      <h2 class="title small">REGLAGES</h2>
      <ul class="binds" id="binds"></ul>
      <div class="row wrap">
        <label class="target" for="f-vol">BRUITAGES
          <input id="f-vol" type="range" min="0" max="100" step="1" value="50">
          <output id="vol-out">50</output>
        </label>
        <label class="target" for="f-music">MUSIQUE
          <input id="f-music" type="range" min="0" max="100" step="1" value="40">
          <output id="music-out">40</output>
        </label>
      </div>
      <div class="row wrap">
        <button class="btn ghost" id="b-reset-keys" type="button">TOUCHES PAR DEFAUT</button>
        <button class="btn primary" id="b-resume" type="button">REPRENDRE</button>
        <button class="btn ghost" id="b-quit" type="button">RETOUR AU LOBBY</button>
      </div>
      <p class="hint">Le <b>+</b> ajoute une touche a la commande, autant qu'on veut.
        Un clic sur une touche la remplace, un clic droit la retire.</p>
    </div>
  </section>

  <p class="toast hidden" id="toast"></p>
</div>

<audio id="track" src="/jumpnbump/assets/soundtrack.mp3" loop preload="none"></audio>
<audio id="track-lobby" src="/jumpnbump/assets/soundtrack_lobby.mp3" loop preload="none"></audio>

<script src="/jumpnbump/game.js"></script>
<script src="/jumpnbump/net.js"></script>
</body>
</html>
