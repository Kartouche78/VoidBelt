<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL2 &middot; Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230B1018'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23F07A25' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="arenes/arenes.css">
</head>
<body>

<header>
  <h1>RL2 <span>admin</span></h1>
  <nav id="sections" aria-label="Sections de l'admin"></nav>
  <input id="token" type="password" placeholder="Jeton admin" autocomplete="off"
         title="RL2_ADMIN_TOKEN du serveur, gardé dans ce navigateur. Inutile sur la machine du serveur.">
</header>

<!-- Outils propres aux reglages du jeu : caches dans les autres sections. -->
<div id="jeu-tools" class="toolbar">
  <input id="search" type="search" placeholder="Chercher un réglage…" autocomplete="off">
  <div class="actions">
    <button id="btn-reset" type="button" class="ghost">Valeurs d&rsquo;usine</button>
    <button id="btn-export" type="button" class="ghost">Exporter</button>
    <button id="btn-import" type="button" class="ghost">Importer</button>
    <button id="btn-publish" type="button" class="go">Publier</button>
  </div>
  <input id="file" type="file" accept="application/json" hidden>
</div>

<p id="status" role="status"></p>

<main id="jeu">
  <nav id="tabs" aria-label="Familles de réglages"></nav>

  <section id="panel">
    <div id="fields"></div>
  </section>

  <aside id="preview">
    <div class="head">
      <span>Aperçu en direct</span>
      <button id="btn-reload" type="button" class="ghost small">Relancer</button>
    </div>
    <iframe id="game" src="/rl2/" title="Aperçu du jeu"></iframe>
    <p class="note">
      Les curseurs s&rsquo;appliquent &agrave; cette partie sans la relancer.
      Les valeurs sont en km/h, en m&egrave;tres et en pourcentages ; le
      fichier publi&eacute;, lui, reste dans les unit&eacute;s du moteur.
    </p>
  </aside>
</main>

<!-- Arenes, skins et IA : un menu d'onglets et la page de l'onglet. -->
<main id="atelier" hidden>
  <nav id="sous-onglets" aria-label="Onglets de la section"></nav>
  <section id="atelier-page"></section>
</main>

<script type="module" src="admin.js"></script>
</body>
</html>
