<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RL2 &middot; VOIDBELT</title>
<meta name="description" content="Football motorise vu de dessus. Moteur Rust compile en WebAssembly, rendu three.js.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230B1018'/%3E%3Crect x='4' y='11' width='6' height='10' rx='1.5' fill='%232F7CE0'/%3E%3Crect x='22' y='11' width='6' height='10' rx='1.5' fill='%23F07A25'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23F2F0EA'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="shell">
  <canvas id="scene"></canvas>

  <!-- Tableau de bord, visible uniquement pendant le match -->
  <div id="hud">
    <div id="scoreboard">
      <div class="side blue"><span id="score-blue">0</span></div>
      <div class="middle">
        <div id="clock">5:00</div>
        <div id="clock-tag" hidden></div>
      </div>
      <div class="side orange"><span id="score-orange">0</span></div>
    </div>

    <div id="message" hidden></div>

    <!-- Bandeau des calques de mise au point (F1 / F2 / F3) -->
    <div id="debug-flash" hidden></div>

    <!-- Panneau de calage du decor (F4) -->
    <div id="fit-panel" hidden></div>

    <!-- Salon en ligne : remplace le tableau de score en attendant le coup d'envoi -->
    <div id="scores" hidden aria-label="Tableau des joueurs"></div>

    <div id="lobby" hidden>
      <div id="teams">
        <button id="btn-team-0" class="team blue" type="button">BLEU</button>
        <span id="team-split">0 v 0</span>
        <button id="btn-team-1" class="team orange" type="button">ORANGE</button>
      </div>
      <button id="btn-stadium-pick">Stade</button>
      <button id="btn-kickoff">Lancer la partie</button>
      <p id="lobby-info"></p>
    </div>

    <!-- Tchat rapide : le groupe ouvert. Les messages, eux, s'affichent
         en bulle au-dessus des voitures. -->
    <div id="chat">
      <div id="chat-quick" hidden></div>
    </div>

    <div id="gauge">
      <div id="sonic" hidden>SUPERSONIQUE</div>
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="50"></circle>
        <circle id="boost-arc" cx="60" cy="60" r="50"></circle>
      </svg>
      <div class="readout">
        <strong id="boost-value">33</strong>
        <small>BOOST</small>
      </div>
      <div class="speed"><strong id="speed-value">0</strong><small>KM/H</small></div>
    </div>
  </div>

  <!-- Accueil -->
  <section id="screen-title" class="screen title" hidden>
    <div class="title-brand">
      <p class="eyebrow">VOIDBELT &middot; ARCADE</p>
      <h1>RL<span>2</span></h1>
    </div>
    <nav class="title-menu">
      <button id="btn-play">Jouer</button>
      <button id="btn-online">Multijoueur</button>
      <button id="btn-settings">Param&egrave;tres</button>
      <button id="btn-quit-site">Quitter</button>
    </nav>
    <p class="title-note">Manette recommand&eacute;e &middot; RT acc&eacute;l&egrave;re, LT recule, B boost, X drift.</p>
  </section>

  <!-- Choix du stade, avant une partie solo -->
  <section id="screen-stadium" class="screen sheet" hidden>
    <div class="sheet-head">
      <p class="eyebrow">VOIDBELT &middot; ARCADE</p>
      <h2>Choisis ton stade</h2>
    </div>
    <div class="sheet-body">
      <nav class="tabs" id="stadium-tabs"></nav>
      <div id="stadium-list"></div>
    </div>
    <nav class="sheet-menu">
      <button id="btn-stadium-back">Retour</button>
    </nav>
  </section>

  <!-- Multijoueur -->
  <section id="screen-online" class="screen sheet" hidden>
    <div class="sheet-head">
      <p class="eyebrow">VOIDBELT &middot; ARCADE</p>
      <h2>Multijoueur</h2>
    </div>
    <div class="sheet-body">
      <div class="row">
        <div class="row-label">Ton pseudo</div>
        <div class="row-control">
          <input id="online-name" type="text" maxlength="16" placeholder="Pilote" autocomplete="off">
        </div>
      </div>
      <div id="online-list"></div>
      <p id="online-status" class="note"></p>
    </div>
    <nav class="sheet-menu">
      <button id="btn-online-create">Cr&eacute;er un salon</button>
      <button id="btn-online-refresh">Actualiser</button>
      <button id="btn-online-back">Retour</button>
    </nav>
  </section>

  <!-- Parametres -->
  <section id="screen-settings" class="screen modal" hidden>
    <div class="modal-card sheet">
      <div class="sheet-head">
        <p class="eyebrow">VOIDBELT &middot; ARCADE</p>
        <h2>Param&egrave;tres</h2>
      </div>
      <div class="sheet-body">
        <nav class="tabs">
          <button data-tab="controls" class="active">Commandes</button>
          <button data-tab="audio">Son</button>
          <button data-tab="match">Match</button>
          <button data-tab="interface">Interface</button>
        </nav>
        <div id="settings-body"></div>
      </div>
      <nav class="sheet-menu">
        <button id="btn-settings-back">Retour</button>
        <button id="btn-settings-reset">R&eacute;initialiser</button>
      </nav>
    </div>
  </section>

  <!-- Pause -->
  <section id="screen-pause" class="screen modal" hidden>
    <div class="modal-card sheet">
      <div class="sheet-head">
        <p class="eyebrow">VOIDBELT &middot; ARCADE</p>
        <h2>Pause</h2>
      </div>
      <nav class="sheet-menu stack">
        <button id="btn-resume">Reprendre</button>
        <button id="btn-pause-settings">Param&egrave;tres</button>
        <button id="btn-pause-restart">Rejouer</button>
        <button id="btn-pause-quit">Quitter</button>
      </nav>
    </div>
  </section>

  <!-- Fin de match -->
  <section id="screen-result" class="screen" hidden>
    <div class="panel">
      <h2 id="result-title">Victoire</h2>
      <p id="result-score">0 - 0</p>
      <div class="actions">
        <button id="btn-result-again" class="primary">Rejouer</button>
        <button id="btn-result-menu">Menu</button>
      </div>
    </div>
  </section>

  <p id="fatal" hidden></p>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
