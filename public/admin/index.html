<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL2 &middot; Reglages</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230B1018'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23F07A25' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header>
  <h1>RL2 <span>reglages</span></h1>
  <input id="search" type="search" placeholder="Chercher un reglage..." autocomplete="off">
  <div class="actions">
    <button id="btn-reset" type="button" class="ghost">Valeurs d&rsquo;usine</button>
    <button id="btn-export" type="button" class="ghost">Exporter</button>
    <button id="btn-import" type="button" class="ghost">Importer</button>
    <button id="btn-publish" type="button" class="go">Publier</button>
  </div>
  <input id="file" type="file" accept="application/json" hidden>
</header>

<p id="status" role="status"></p>

<main>
  <nav id="tabs" aria-label="Familles de reglages"></nav>

  <section id="panel">
    <div id="fields"></div>
  </section>

  <aside id="preview">
    <div class="head">
      <span>Apercu en direct</span>
      <button id="btn-reload" type="button" class="ghost small">Relancer</button>
    </div>
    <iframe id="game" src="/rl2/" title="Apercu du jeu"></iframe>
    <p class="note">
      Les curseurs s&rsquo;appliquent a cette partie sans la relancer. Un
      changement de taille de voiture ou de balle se voit au prochain
      engagement.
    </p>
  </aside>
</main>

<script type="module" src="admin.js"></script>
</body>
</html>
