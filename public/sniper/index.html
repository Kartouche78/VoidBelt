/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

:root { --acc: #43e3c0; --ink: #12151b; --mute: #6b7280; --line: #e3e6ec; --panel: #ffffff; }
#app { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); display: flex; background: #dcdfe8; }
.view { position: relative; flex: 1; min-width: 0; height: 100%; overflow: hidden; }
.view #gl { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.view #gl:active { cursor: grabbing; }
.title { position: absolute; left: 28px; top: 24px; pointer-events: none; }
.title .code { display: inline-block; font: 600 12px/1 'JetBrains Mono', monospace; letter-spacing: .08em; color: var(--ink);
  background: color-mix(in srgb, var(--acc) 30%, white); border: 1px solid color-mix(in srgb, var(--acc) 60%, white); padding: 5px 8px; border-radius: 6px; }
.title .name { font: 800 30px/1.1 'Inter', sans-serif; letter-spacing: -.02em; margin-top: 10px; }
.title .sub { font: 500 14px/1.3 'Inter', sans-serif; color: var(--mute); margin-top: 4px; }
.hint { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); font: 500 12px 'Inter', sans-serif; color: #5b6170;
  background: rgba(255,255,255,.6); padding: 6px 12px; border-radius: 99px; pointer-events: none; backdrop-filter: blur(6px); white-space: nowrap; }
.toast { position: absolute; left: 50%; top: 24px; transform: translate(-50%, -10px); opacity: 0; transition: .25s; background: var(--ink); color: #fff;
  font: 600 13px 'Inter', sans-serif; padding: 9px 14px; border-radius: 8px; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.labs { position: absolute; inset: 0; pointer-events: none; }
.lab { position: absolute; left: 0; top: 0; opacity: 0; display: flex; align-items: center; gap: 8px; transition: opacity .2s; }
.lab i { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.15); margin: -5px 0 0 -5px; }
.lab b { font: 600 12px 'Inter', sans-serif; background: #fff; padding: 5px 9px; border-radius: 7px; box-shadow: 0 2px 10px rgba(15,23,42,.12); white-space: nowrap; }

.panel { width: 392px; flex: none; height: 100%; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 8px 22px 28px; }
.panel section { padding: 16px 0; border-bottom: 1px solid var(--line); }
.panel section:last-child { border-bottom: 0; }
.panel h2 { font: 700 13px 'Inter', sans-serif; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 12px; display: flex; justify-content: space-between; }
.panel h2 span { font: 600 12px 'JetBrains Mono', monospace; color: var(--mute); text-transform: none; letter-spacing: 0; }
.lbl { display: flex; justify-content: space-between; font: 600 12px 'Inter', sans-serif; color: var(--mute); margin: 4px 0 8px; }
.lbl b { color: var(--ink); font-family: 'JetBrains Mono', monospace; }
#name { width: 100%; font: 600 15px 'Inter', sans-serif; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; outline: none; }
#name:focus { border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 25%, transparent); }
button { font-family: 'Inter', sans-serif; cursor: pointer; }

.barrels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bar { display: flex; flex-direction: column; padding: 0; border: 1.5px solid var(--line); border-radius: 10px; background: #f4f5f8; overflow: hidden; text-align: left; transition: .15s; }
.bar img { width: 100%; aspect-ratio: 2 / 1; display: block; object-fit: cover; background: #dfe2ea; }
.bar span { font: 500 11.5px/1.2 'Inter', sans-serif; padding: 6px 8px 7px; color: #374151; }
.bar span b { font-family: 'JetBrains Mono', monospace; color: var(--ink); margin-right: 2px; }
.bar:hover { border-color: #c5cad4; transform: translateY(-1px); }
.bar.on { border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 25%, transparent); background: #fff; }
.desc { font: 400 13px/1.45 'Inter', sans-serif; color: #4b5563; margin: 12px 0 0; }

.stat { display: grid; grid-template-columns: 78px 1fr 28px; align-items: center; gap: 10px; margin: 7px 0; font: 500 12.5px 'Inter', sans-serif; }
.stat .track { position: relative; height: 8px; border-radius: 4px; background: #eceef2; overflow: hidden; }
.stat .track b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 4px; }
.stat .track em { position: absolute; top: 0; bottom: 0; opacity: .9; transition: opacity .3s; }
.stat .track em.up { background: var(--acc); }
.stat .track em.down { background: #f87171; }
.stat i { font: 600 12px 'JetBrains Mono', monospace; font-style: normal; text-align: right; }
.mass { display: flex; justify-content: space-between; margin-top: 12px; font: 500 12.5px 'Inter', sans-serif; color: var(--mute); }
.mass b { color: var(--ink); font-family: 'JetBrains Mono', monospace; }

.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pre { display: flex; align-items: center; gap: 3px; padding: 7px 8px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; }
.pre i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.pre span { font: 500 12px 'Inter', sans-serif; margin-left: 5px; }
.pre.on { border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 25%, transparent); }
.pickers { display: flex; gap: 10px; margin-top: 12px; }
.pickers label { flex: 1; display: flex; align-items: center; gap: 8px; font: 500 12.5px 'Inter', sans-serif; border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; cursor: pointer; }
.pickers input { width: 26px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; }

.switch { display: flex; align-items: center; gap: 10px; font: 500 14px 'Inter', sans-serif; cursor: pointer; }
.switch input { display: none; }
.switch i { width: 38px; height: 22px; border-radius: 11px; background: #d1d5db; position: relative; transition: .2s; }
.switch i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch input:checked + i { background: var(--ink); }
.switch input:checked + i::after { left: 19px; background: var(--acc); }

.parts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.part { text-align: left; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; }
.part b { display: block; font: 600 13px 'Inter', sans-serif; }
.part span { display: block; font: 400 11px/1.3 'Inter', sans-serif; color: var(--mute); margin-top: 3px; }
.part.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.part.on span { color: color-mix(in srgb, var(--acc) 70%, white); }
.part:disabled { opacity: .4; cursor: not-allowed; }
input[type=range] { width: 100%; accent-color: var(--ink); }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button { flex: 1; padding: 10px 12px; font: 600 13px 'Inter', sans-serif; border-radius: 9px; border: 0; background: var(--ink); color: #fff; }
.actions button:hover { filter: brightness(1.25); }
.actions .ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }

@media (max-width: 900px) {
  #app { flex-direction: column; }
  .view { flex: none; height: 52%; }
  .panel { width: 100%; height: 48%; border-left: 0; border-top: 1px solid var(--line); }
  .title .name { font-size: 22px; }
}

</style>
